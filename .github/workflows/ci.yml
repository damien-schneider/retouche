name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the package, whose types the site resolves through dist
        run: bun run build
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
